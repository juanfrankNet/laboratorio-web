                    <p class="text-slate-500 dark:text-slate-400 text-sm">Optimiza tu contenido para SEO y legibilidad profesional.</p>
                </div>

                <div class="p-6 border-b border-slate-50 dark:border-slate-800 flex flex-wrap gap-2">
                    <button onclick="formatText('upper')" class="px-4 py-2 text-[10px] font-bold uppercase bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">Mayúsculas</button>
                    <button onclick="formatText('lower')" class="px-4 py-2 text-[10px] font-bold uppercase bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">Minúsculas</button>
                    <button onclick="formatText('clean')" class="px-4 py-2 text-[10px] font-bold uppercase text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl hover:scale-105 transition-all">Limpiar Espacios</button>
                </div>

                <div class="p-6">
                    <textarea 
                        id="textInput" 
                        oninput="updateAll()"

                        class="w-full h-80 p-6 bg-slate-50 dark:bg-[#0f172a] border-2 border-transparent focus:border-indigo-500/50 rounded-2xl outline-none transition-all text-lg leading-relaxed resize-none dark:placeholder:text-slate-700"
                    ></textarea>
                    <div class="mt-4 flex justify-between items-center">
                        <span id="legibilidadTag" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full">Legibilidad: -</span>
                        <button onclick="copyText()" id="copyBtn" class="flex items-center gap-2 text-[10px] font-bold uppercase text-indigo-600 dark:text-indigo-400 hover:underline">
                            <span id="copyIcon">📋</span> <span id="copyTxt">Copiar Todo</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-md border border-slate-100 dark:border-slate-800">
                    <div class="flex justify-between text-[10px] font-bold uppercase text-slate-400 mb-3 font-mono">
                        <span>Google Title</span>
                        <span id="titleCount">0/60</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="titleBar" class="progress-bar h-full bg-indigo-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-md border border-slate-100 dark:border-slate-800">
                    <div class="flex justify-between text-[10px] font-bold uppercase text-slate-400 mb-3 font-mono">
                        <span>Meta Desc</span>
                        <span id="metaCount">0/160</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="metaBar" class="progress-bar h-full bg-emerald-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-md border border-slate-100 dark:border-slate-800">

                    <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="twBar" class="progress-bar h-full bg-sky-500" style="width: 0%"></div>

        <div class="space-y-6">

                <h2 id="wordCount" class="text-7xl font-black tracking-tighter mb-8">0</h2>

    <script>
        function toggleTheme() {
            const html = document.getElementById('htmlTag');
            const isDark = html.classList.toggle('dark');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('themeText').textContent = isDark ? 'Modo Claro' : 'Modo Oscuro';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('htmlTag').classList.add('dark');
            document.getElementById('themeIcon').textContent = '☀️';
            document.getElementById('themeText').textContent = 'Modo Claro';
        }

        function formatText(action) {
            const area = document.getElementById('textInput');
            if (action === 'upper') area.value = area.value.toUpperCase();
            if (action === 'lower') area.value = area.value.toLowerCase();
            if (action === 'clean') area.value = area.value.replace(/\s+/g, ' ').trim();
            updateAll();
        }

        function updateAll() {
            const text = document.getElementById('textInput').value;
            const words = text.trim() ? text.trim().split(/\s+/) : [];
            document.getElementById('wordCount').innerText = words.length;
            document.getElementById('charCount').innerText = text.length;
            document.getElementById('readingTime').innerText = Math.max(1, Math.ceil(words.length / 200));

            updateBar('title', text.length, 60);
            updateBar('meta', text.length, 160);
            updateBar('tw', text.length, 280);
            updateFreq(words);
        }

        function updateBar(id, val, max) {
            const bar = document.getElementById(id + 'Bar');
            const txt = document.getElementById(id + 'Count');
            const perc = Math.min((val / max) * 100, 100);
            bar.style.width = perc + '%';
            txt.innerText = `${val}/${max}`;
            bar.className = `progress-bar h-full ${val > max ? 'bg-red-500' : (id === 'title' ? 'bg-indigo-500' : id === 'meta' ? 'bg-emerald-500' : 'bg-sky-500')}`;
        }

        function updateFreq(words) {
            const freq = {};
            words.forEach(w => {
                const clean = w.toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '');
                if (clean.length > 3) freq[clean] = (freq[clean] || 0) + 1;
            });
            const sorted = Object.entries(freq).sort((a,b) => b[1] - a[1]).slice(0, 5);
            document.getElementById('freqList').innerHTML = sorted.map(([word, count]) => `
                <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-[#0f172a] rounded-xl border border-slate-100 dark:border-slate-800 animate-fade">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-300">${word}</span>
                    <span class="px-2 py-1 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 rounded-lg text-[10px] font-black">${count}</span>
                </div>`).join('') || '<p class="text-slate-400 text-xs italic">Escribe algo...</p>';
        }

        function copyText() {
            navigator.clipboard.writeText(document.getElementById('textInput').value);
            const copyTxt = document.getElementById('copyTxt');
            copyTxt.innerText = '¡Copiado!';
            setTimeout(() => copyTxt.innerText = 'Copiar Todo', 2000);
        }

        function clearAll() {
            if(confirm('¿Borrar contenido?')) {
                document.getElementById('textInput').value = '';
                updateAll();
            }
        }
    </script>
